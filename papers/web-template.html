<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>$title$ — allocation</title>
<style>
  :root{--bg:#fafafa;--text:#1a1a1a;--muted:#5a5a5a;--faint:#9a9a9a;--accent:#4a3aff;--border:#e6e6e6}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    line-height:1.65;font-size:17px}
  a{color:var(--accent);text-decoration:none} a:hover{text-decoration:underline}
  code{background:#f1f1f4;padding:1px 5px;border-radius:3px;font-size:.92em;
    font-family:"SFMono-Regular",Menlo,Consolas,monospace}
  .crumb{max-width:760px;margin:0 auto;padding:20px 24px 0;display:flex;gap:18px;font-size:.95rem}
  .crumb a{color:var(--muted)} .crumb a:hover{color:var(--accent)}
  main{max-width:760px;margin:14px auto 0;padding:0 24px 40px}
  h1{font-size:1.95rem;line-height:1.25;margin:.3em 0 .1em}
  .author{color:var(--muted);margin:.2em 0 1.4em}
  .abstract{background:#fff;border:1px solid var(--border);border-radius:8px;
    padding:14px 18px;margin:0 0 28px;font-size:.97rem;color:#2a2a2a}
  h2{font-size:1.3rem;margin:1.9em 0 .5em;border-bottom:1px solid var(--border);padding-bottom:3px}
  h3{font-size:1.06rem;margin:1.4em 0 .35em}
  p{margin:.7em 0}
  .math.display{overflow-x:auto;overflow-y:hidden}
  table{border-collapse:collapse;margin:16px 0;font-size:.95rem;width:100%}
  th,td{text-align:left;padding:7px 12px;border-bottom:1px solid var(--border)}
  thead th{border-bottom:2px solid var(--border)}
  figure{margin:20px 0;text-align:center} figure img{max-width:100%;height:auto}
  figcaption{color:var(--muted);font-size:.9rem;margin-top:6px}
  .algorithm{background:#fff;border:1px solid var(--border);border-radius:8px;padding:12px 16px 14px;margin:18px 0}
  .algo-title{margin:0 0 6px;font-size:.98rem}
  ol.algo{margin:0;padding-left:1.5em} ol.algo li{margin:.3em 0}
  .algo .kw{font-variant:small-caps;font-weight:600}
  .algo .cmt{color:var(--faint);font-size:.9em;margin-left:.3em}
  h4{font-size:.99rem;margin:1.1em 0 .3em;color:#2a2a2a}
  .runin{font-weight:600;color:#2a2a2a;margin-right:.4em}
  /* amsthm environments. pandoc emits <div class="proposition"> etc. with the number already in a <strong>;
     without these rules a theorem is visually identical to body text, which is the main thing that made this
     read as a LaTeX dump rather than a paper. */
  .theorem,.proposition,.lemma,.corollary,.definition,.remark,.example,.assumption{
    background:#fff;border:1px solid var(--border);border-left:3px solid var(--accent);
    border-radius:0 8px 8px 0;padding:12px 16px;margin:18px 0}
  .remark,.example{border-left-color:#bdbdc7}
  .theorem p,.proposition p,.lemma p,.corollary p,.definition p,.remark p,.example p{margin:.35em 0}
  .theorem em,.proposition em,.lemma em,.corollary em,.theorem>p>em{font-style:italic}
  .proof{margin:14px 0 18px;padding-left:14px;border-left:2px solid var(--border);color:#333;font-size:.97rem}
  .proof p{margin:.35em 0}
  /* pandoc already appends a QED mark (U+25FB) to the last proof paragraph -- do NOT add another */
  /* table of contents */
  nav#TOC{background:#fff;border:1px solid var(--border);border-radius:8px;padding:12px 18px;margin:0 0 30px;font-size:.95rem}
  nav#TOC::before{content:"Contents";display:block;font-weight:600;font-size:.9rem;
    letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
  nav#TOC ul{margin:.2em 0;padding-left:1.15em;list-style:none} nav#TOC>ul{padding-left:0}
  nav#TOC li{margin:.15em 0} nav#TOC a{color:var(--text)} nav#TOC a:hover{color:var(--accent)}
  nav#TOC ul ul{font-size:.93em;color:var(--muted)}
  /* MathJax equation numbers sit right; keep long displays scrollable without clipping the tag */
  mjx-container[display="true"]{overflow-x:auto;overflow-y:hidden;padding:2px 0}
  /* bibliography. pandoc --citeproc emits .csl-bib-body/.csl-entry, NOT .references div, so the old rule
     never applied and the reference list rendered as unindented body text. */
  .references,.csl-bib-body{font-size:.92rem}
  .csl-entry{margin:.5em 0;padding-left:1.6em;text-indent:-1.6em;color:#2f2f2f}
  .csl-entry a{word-break:break-word}
  .citation{white-space:nowrap}
  /* section numbers: a little air between "3" and the title, in headings and in the contents */
  .header-section-number{margin-right:.45em;color:var(--muted);font-weight:600}
  nav#TOC .toc-section-number{margin-right:.5em;color:var(--faint);font-variant-numeric:tabular-nums}
  /* footnotes */
  .footnote-ref{font-size:.8em;vertical-align:super;line-height:0;padding:0 1px}
  .footnotes{margin-top:34px;padding-top:12px;border-top:1px solid var(--border);
    font-size:.9rem;color:var(--muted)}
  .footnotes hr{display:none}
  .footnotes ol{padding-left:1.3em} .footnotes li{margin:.35em 0}
  .footnote-back{margin-left:.35em;font-size:.85em}
  @media print{
    body{background:#fff;font-size:11pt} .crumb,nav#TOC{display:none}
    .theorem,.proposition,.lemma,.corollary,.definition,.remark{break-inside:avoid}
    h2,h3{break-after:avoid}
  }
  footer{max-width:760px;margin:24px auto 40px;padding:18px 24px 0;border-top:1px solid var(--border);
    color:var(--faint);font-size:.85rem} footer a{color:var(--muted)}
</style>
<script>
  window.MathJax = {
    tex: {tags: 'ams', tagSide: 'right', macros: {}},
    options: {skipHtmlTags: ['script','noscript','style','textarea','pre','code']}
  };
</script>
$math$
</head>
<body>
<div class="crumb">
  <a href="../../">&larr; allocation</a>
  <a href="../">papers</a>
  <a href="https://github.com/microprediction/allocation">GitHub</a>
</div>
<main>
<h1>$title$</h1>
$if(author)$<p class="author">$for(author)$$author$$sep$, $endfor$</p>$endif$
$if(abstract)$<div class="abstract">$abstract$</div>$endif$
$if(toc)$<nav id="TOC" role="doc-toc">
$toc$
</nav>$endif$
$body$
</main>
<footer>
  allocation &middot; MIT licensed &middot;
  <a href="https://github.com/microprediction/allocation">microprediction/allocation</a>
</footer>
</body>
</html>
